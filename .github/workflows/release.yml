name: Release

# Pushing a tag like v0.2.0 builds every platform and creates a draft release.
# See docs/RELEASING.md for the secrets this needs.
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
          - os: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WAYMARK_CURSEFORGE_API_KEY: ${{ secrets.WAYMARK_CURSEFORGE_API_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Waymark Launcher ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      # The site's Download button points at releases/latest/download/Waymark-Launcher_x64-setup.exe,
      # so every release carries a copy of the installer under that name and the site never
      # needs changing for a new version. Waymark_x64-setup.exe is the name from before the
      # rename, kept for links already out there. Once installers are code signed, copy the signed one.
      - name: Add the installer under a name that stays the same
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = @(Get-ChildItem target/release/bundle/nsis -Filter '*_x64-setup.exe')
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)" }
          Copy-Item $installer[0].FullName Waymark-Launcher_x64-setup.exe
          Copy-Item $installer[0].FullName Waymark_x64-setup.exe
          gh release upload '${{ github.ref_name }}' Waymark-Launcher_x64-setup.exe Waymark_x64-setup.exe --clobber
