name: CI

# Docs and the website can't break the app, and every run here costs macOS minutes.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'apps/site/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'apps/site/**']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Check the UI
        run: npm run check
        working-directory: apps/desktop

      # Text is translated by matching it exactly, so a new or reworded string
      # without a catalog row would quietly stay English.
      - name: Check every string has a translation
        run: npm run check:i18n
        working-directory: apps/desktop

      - name: Build the UI
        run: npm run build
        working-directory: apps/desktop

      - name: Test the core
        run: cargo test -p waymark-core

      # CurseForge's CDN refuses downloads without the app's key, and only CI has it.
      - name: Download a file from CurseForge with the real key
        if: runner.os == 'Linux' && github.event_name == 'push'
        env:
          WAYMARK_CURSEFORGE_API_KEY: ${{ secrets.WAYMARK_CURSEFORGE_API_KEY }}
        run: cargo test -p waymark-core live_curseforge -- --ignored

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
