[workspace]
resolver = "3"
members = ["crates/waymark-core", "crates/waymark-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/Woblu/waymark-launcher"

# The launcher is judged on how fast it feels, so release builds trade
# compile time for runtime speed and a smaller binary.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

# Hashing and decompression are painfully slow unoptimised, even while developing.
[profile.dev.package."*"]
opt-level = 2
